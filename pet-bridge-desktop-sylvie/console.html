<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pet Bridge 控制台</title>
    <link rel="stylesheet" href="./console.css" />
  </head>
  <body>
    <main class="console-shell">
      <header class="console-header">
        <div>
          <p class="eyebrow">Pet Bridge Desktop</p>
          <h1 id="petName">希尔薇</h1>
        </div>
        <div class="header-actions">
          <button id="importPet" type="button">导入宠物</button>
          <button id="resetPet" type="button">恢复默认</button>
        </div>
      </header>

      <section class="grid">
        <section class="panel pet-panel">
          <div class="section-head">
            <h2>动作与大小</h2>
            <div class="compact-actions">
              <button class="compact-button" id="keymapToggle" type="button">按键映射</button>
              <label class="toggle">
                <input id="pinState" type="checkbox" />
                <span>固定动作</span>
              </label>
            </div>
          </div>
          <div class="state-row" id="stateRow"></div>
          <div class="keymap-panel" id="keymapPanel" hidden>
            <div class="keymap-list" id="keymapList"></div>
          </div>
          <label class="slider-row">
            <span>桌面大小</span>
            <input id="scaleSlider" type="range" min="0.55" max="2.6" step="0.05" value="1.2" />
            <output id="scaleOutput">120%</output>
          </label>
          <div class="speech-row">
            <input id="speechInput" type="text" placeholder="让桌宠说一句话" />
            <button id="sayButton" type="button">显示</button>
          </div>
        </section>

        <section class="panel chat-panel">
          <div class="section-head">
            <h2>对话</h2>
            <label class="toggle">
              <input id="llmEnabled" type="checkbox" />
              <span>启用 LLM</span>
            </label>
          </div>
          <div class="chat-log" id="chatLog"></div>
          <form class="chat-form" id="chatForm">
            <input id="chatInput" type="text" placeholder="和桌宠说话" autocomplete="off" />
            <button type="submit">发送</button>
          </form>
        </section>

        <section class="panel prompt-panel">
          <h2>提示词系统</h2>
          <label class="textarea-field">
            <span>系统人设 System Prompt</span>
            <textarea id="personaPrompt" spellcheck="false"></textarea>
          </label>
          <label class="textarea-field">
            <span>Assistant Message</span>
            <textarea id="assistantPrompt" spellcheck="false"></textarea>
          </label>
          <label class="textarea-field">
            <span>TTS Prompt / Instructions</span>
            <textarea id="ttsPrompt" spellcheck="false"></textarea>
          </label>
        </section>

        <section class="panel settings-panel">
          <h2>接口</h2>
          <div class="settings-grid">
            <label>
              <span>LLM Base URL</span>
              <input id="llmBaseUrl" type="text" placeholder="https://api.openai.com/v1" />
            </label>
            <label>
              <span>LLM Model</span>
              <input id="llmModel" type="text" placeholder="模型名" />
            </label>
            <label>
              <span>LLM API Key</span>
              <input id="llmApiKey" type="password" placeholder="可留空使用环境变量" />
            </label>
            <label>
              <span>TTS 模式</span>
              <select id="ttsMode">
                <option value="browser">系统语音</option>
                <option value="api">TTS API</option>
              </select>
            </label>
            <label>
              <span>TTS Base URL</span>
              <input id="ttsBaseUrl" type="text" placeholder="https://api.openai.com/v1" />
            </label>
            <label>
              <span>TTS Model</span>
              <input id="ttsModel" type="text" placeholder="gpt-4o-mini-tts" />
            </label>
            <label>
              <span>TTS Voice</span>
              <input id="ttsVoice" type="text" placeholder="alloy / coral / marin" />
            </label>
            <label class="toggle wide-toggle">
              <input id="ttsEnabled" type="checkbox" checked />
              <span>启用语音</span>
            </label>
            <label>
              <span>TTS API Key</span>
              <input id="ttsApiKey" type="password" placeholder="可留空使用环境变量" />
            </label>
          </div>
        </section>

        <section class="panel history-panel">
          <div class="section-head">
            <h2>历史对话</h2>
            <div class="compact-actions">
              <button id="addHistory" type="button">新增</button>
              <button id="clearHistory" type="button">清空</button>
            </div>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>
      </section>
    </main>

    <script src="./shared-protocol.js"></script>
    <script src="./console.js"></script>
  </body>
</html>
